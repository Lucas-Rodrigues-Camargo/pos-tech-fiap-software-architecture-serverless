name: Deploy Notifications
on:
  push:
    branches: [main]
    paths: ['functions/notifications/**', 'template-notifications.yaml', 'package*.json']
  workflow_dispatch:
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && !contains(github.event.head_commit.message, '[no deploy]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: us-east-1 }
      - run: sam build --template-file template-notifications.yaml
      - env: { FROM_EMAIL: '${{ vars.FROM_EMAIL }}' }
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name oficina-notifications --resolve-s3 --capabilities CAPABILITY_IAM --parameter-overrides FromEmail="$FROM_EMAIL"

