name: Deploy Auth
on:
  push:
    branches: [main]
    paths: ['functions/auth/**', 'template-auth.yaml', 'package*.json']
  workflow_dispatch:
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && !contains(github.event.head_commit.message, '[no deploy]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: us-east-1 }
      - run: sam build --template-file template-auth.yaml
      - env:
          CUSTOMER_API_URL: ${{ vars.CUSTOMER_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
          LAMBDA_SECURITY_GROUP_IDS: ${{ vars.LAMBDA_SECURITY_GROUP_IDS }}
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name oficina-auth --resolve-s3 --capabilities CAPABILITY_IAM --parameter-overrides CustomerApiUrl="$CUSTOMER_API_URL" InternalApiKey="$INTERNAL_API_KEY" JwtKey="$JWT_KEY" PrivateSubnetIds="$PRIVATE_SUBNET_IDS" LambdaSecurityGroupIds="$LAMBDA_SECURITY_GROUP_IDS"

